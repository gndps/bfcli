[package]
name = "bfcli"
version = "0.1.3"
edition = "2021"
description = "A simple shell file sourcing manager"
license = "MIT"
repository = "https://github.com/gndps/bfcli"
homepage = "https://github.com/gndps/bfcli"

[[bin]]
name = "bfcli"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"
